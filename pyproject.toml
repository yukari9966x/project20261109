[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ksfix"
dynamic = ["version"]
description = "KS-Fix: KS A 0001 표준안 서식 자동교정 AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KS-Fix contributors" }]
keywords = ["KS", "KS A 0001", "docx", "standard", "proofreading", "track changes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Korean",
  "Operating System :: OS Independent",
]
dependencies = [
  "python-docx==1.2.0",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
# 웹 UI·REST API
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# LLM 호출은 표준 라이브러리 urllib로 구현하므로 추가 의존성이 없다.
llm = []
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]
exe = ["pyinstaller>=6"]

[project.scripts]
ksfix = "ksfix.cli:main"

[tool.hatch.version]
path = "src/ksfix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ksfix"]

[tool.hatch.build.targets.wheel.force-include]
"webapp" = "ksfix/webapp"

[tool.hatch.build.targets.sdist]
include = ["src", "webapp", "tests", "scripts", "config", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
# 한국어 문자열·정규식은 길어지므로 줄 길이는 포매터에 맡긴다.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ksfix"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
