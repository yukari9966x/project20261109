name: release
# 태그 v* : 휠 + Windows 실행파일 zip을 만들어 GitHub Release에 올린다.
# 패키징 파일이 바뀐 푸시·수동 실행: 빌드와 자체 점검만 하고 결과물은 Actions 아티팩트로 남긴다.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[web]" pyinstaller
      - run: pyinstaller packaging/ksfix.spec --noconfirm
      - name: selftest
        run: dist\ksfix\ksfix.exe --selftest
      - run: Compress-Archive -Path dist\ksfix -DestinationPath ksfix-win64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ksfix-win64
          path: ksfix-win64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/wheel/*.whl artifacts/ksfix-win64/ksfix-win64.zip \
            --repo "$GITHUB_REPOSITORY" --generate-notes
