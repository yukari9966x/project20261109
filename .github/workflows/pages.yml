name: pages
# 브라우저 데모(Pyodide)를 GitHub Pages에 배포한다.
# 무료 계정은 공개 저장소에서만 Pages를 쓸 수 있다. 저장소 설정 > Pages > Source를 "GitHub Actions"로 하고
# 저장소 변수 KSFIX_PAGES=true 를 넣으면 태그(v*) 푸시 때 배포된다. 수동 실행도 된다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.KSFIX_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_pages.py -o site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
