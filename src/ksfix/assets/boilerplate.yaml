# KS A 0001:2023 정형문(6.1.3·6.4.1·6.4.2·부속서 E·N). 도구 기능에 필요한 짧은 문구만 담는다.
foreword:
  issue:
    enact: "이 표준은 산업표준화법 관련 규정에 따라 산업표준심의회의 심의를 거쳐 제정한 한국산업표준이다."
    revise: "이 표준은 산업표준화법 관련 규정에 따라 산업표준심의회의 심의를 거쳐 개정한 한국산업표준이다. 이에 따라 {prev}은(는) 개정되어 이 표준으로 바뀌었다."
  copyright:
    - "이 표준의 내용 일부 또는 전부는 저작권법에 따른 보호대상이 되는 저작물이 될 수 있다."
    - "이 표준의 내용 일부 또는 전부가 ISOㆍIEC 등에서 제정한 표준을 참고하여 제정 또는 개정된 경우, 해당 표준의 저작권을 보유하고 있는 ISOㆍIEC 등의 저작권 보호 규정 등에 따라 보호되어야 한다."
  # 부속서 E 예시는 "출원공개 후의", KS A 0001:2023 자체 머리말과 발간본은 "출원공개 이후의"를 쓴다 → 둘 다 허용.
  patent:
    - "이 표준의 일부가 기술적 성질을 가진 특허권, 출원공개 후의 특허출원, 실용신안권 또는 출원공개 후의 실용신안등록출원에 저촉될 가능성이 있다는 것에 주의를 환기한다. 관계 중앙행정기관의 장과 산업표준심의회는 이러한 기술적 성질을 가진 특허권, 출원공개 후의 특허출원, 실용신안권 또는 출원공개 후의 실용신안등록출원에 관계되는 확인에 대하여 책임을 지지 않는다."
    - "이 표준의 일부가 기술적 성질을 가진 특허권, 출원공개 이후의 특허출원, 실용신안권 또는 출원공개 후의 실용신안등록출원에 저촉될 가능성이 있다는 것에 주의를 환기한다. 관계 중앙행정기관의 장과 산업표준심의회는 이러한 기술적 성질을 가진 특허권, 출원공개 이후의 특허출원, 실용신안권 또는 출원공개 후의 실용신안등록출원에 관계되는 확인에 대하여 책임을 지지 않는다."
normref:
  intro: "다음의 인용표준은 전체 또는 부분적으로 이 표준의 적용을 위해 필수적이다. 발행연도가 표기된 인용표준은 인용된 판만을 적용한다. 발행연도가 표기되지 않은 인용표준은 최신판(모든 추록을 포함)을 적용한다."
