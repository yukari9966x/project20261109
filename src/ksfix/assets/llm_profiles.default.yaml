# LLM 프로필 예시. config/llm_profiles.yaml 로 복사해서 쓴다(모델 이름은 `ollama list`로 확인).
# 값의 ${환경변수}는 로딩 시 치환된다. API 키는 이 파일에 직접 쓰지 말고 api_key_env로 환경변수 이름만 적는다.
profiles:
  none:
    provider: none
  ollama-exaone:
    provider: openai_compat
    base_url: "http://localhost:11434/v1"
    model: "exaone3.5:7.8b"
  ollama-gemma:
    provider: openai_compat
    base_url: "http://localhost:11434/v1"
    model: "gemma3:4b"
  vllm-gptoss:
    provider: openai_compat
    base_url: "http://localhost:8000/v1"
    model: "openai/gpt-oss-20b"
  gov-common:                     # 행안부 AI 공통기반: 규격 확인 후 채움
    provider: openai_compat
    base_url: "${KSFIX_GOV_BASE_URL}"
    model: "${KSFIX_GOV_MODEL}"
    api_key_env: "KSFIX_GOV_API_KEY"
    external: true                # 외부 전송 경고 표시
  upstage-solar:
    provider: openai_compat
    base_url: "https://api.upstage.ai/v1"
    model: "${KSFIX_SOLAR_MODEL}"
    api_key_env: "UPSTAGE_API_KEY"
    external: true
